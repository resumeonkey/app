name: Daily Job Digest

on:
  # 7:00 AM Pacific (15:00 UTC) on weekdays
  schedule:
    - cron: "0 15 * * 1-5"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry_run (no email sent, no DB write)"
        type: boolean
        default: false
      min_score:
        description: "Minimum score (0-10) for an offer to be listed"
        default: "0"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BACKEND_URL: https://resume-adapter-api.onrender.com

    steps:
      - name: Wake backend (free-tier cold start)
        run: curl -s -o /dev/null --max-time 120 --retry 3 --retry-delay 10 "${BACKEND_URL}/api/health" || true

      - name: Trigger digest endpoint
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '0' }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${BACKEND_URL}/api/digest/run?dry_run=${DRY_RUN}&min_score=${MIN_SCORE}" \
            -H "X-Digest-Key: ${{ secrets.DIGEST_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 720)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Digest endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Surface key metrics in the job summary
          JOBS_FOUND=$(echo "$BODY" | grep -o '"jobs_found":[0-9]*' | cut -d: -f2 || echo "?")
          JOBS_EMAILED=$(echo "$BODY" | grep -o '"jobs_emailed":[0-9]*' | cut -d: -f2 || echo "?")
          EMAIL_SENT=$(echo "$BODY" | grep -o '"email_sent":true' || echo '"email_sent":false')

          echo "### 🐵 Digest result" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Jobs found | $JOBS_FOUND |" >> $GITHUB_STEP_SUMMARY
          echo "| Jobs emailed | $JOBS_EMAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Email sent | $EMAIL_SENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | $DRY_RUN |" >> $GITHUB_STEP_SUMMARY
